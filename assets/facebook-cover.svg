<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06111F"/>
      <stop offset="50%" stop-color="#0D1F35"/>
      <stop offset="100%" stop-color="#162B47"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8942A" stop-opacity="0"/>
      <stop offset="15%" stop-color="#B8942A" stop-opacity="1"/>
      <stop offset="85%" stop-color="#B8942A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8942A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldFadeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8942A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#B8942A" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#B8942A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B8942A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#bg)"/>

  <!-- Subtle noise texture overlay -->
  <rect width="820" height="312" fill="#0D1F35" opacity="0.15"/>

  <!-- Horizontal gold lines top/bottom -->
  <rect x="0" y="1" width="820" height="1" fill="url(#goldFade)" opacity="0.35"/>
  <rect x="0" y="310" width="820" height="1" fill="url(#goldFade)" opacity="0.35"/>

  <!-- Large decorative "0" — right side watermark -->
  <text x="720" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="380" font-weight="400" fill="#B8942A" opacity="0.055" text-anchor="middle">0</text>

  <!-- Vertical gold accent line — left -->
  <rect x="64" y="72" width="1.5" height="168" fill="url(#goldFadeV)"/>

  <!-- Eyebrow label -->
  <text x="84" y="104" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#C9A84C" letter-spacing="3.5" opacity="0.9">RECURSO ADMINISTRATIVO DE TRÂNSITO</text>

  <!-- Main brand name -->
  <text x="84" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" fill="#FFFFFF" letter-spacing="1">Zero Pontos</text>

  <!-- Gold divider rule -->
  <rect x="84" y="188" width="52" height="1" fill="#B8942A" opacity="0.8"/>

  <!-- Tagline -->
  <text x="84" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" font-style="italic" fill="#F8F7F4" opacity="0.65">Você dirige. Nós cuidamos do resto.</text>

  <!-- Bottom info bar -->
  <text x="84" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#B8942A" letter-spacing="2" opacity="0.75">JOINVILLE, SC  ·  TODO O BRASIL  ·  (47) 9725-4794</text>

</svg>
